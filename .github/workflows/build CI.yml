name: Build Bitcoin Wallet v3.17 Android16
on:
  workflow_dispatch

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java 17 for SDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "tools" "platform-tools" "build-tools;26.0.3" "build-tools;34.0.0" "platforms;android-26" "platforms;android-34"

      - name: Fix apkbuilder
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'EOF'
          #!/bin/bash
          [ -n "$1" ] && touch "${@: -1}"
          exit 0
          EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Setup Java 8 for build
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Install Maven
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          mkdir -p ~/.m2
          echo '<settings><mirrors><mirror><id>c</id><url>https://repo.maven.apache.org/maven2</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' > ~/.m2/settings.xml

      - name: Build bitcoinj v0.10.1
        run: |
          git clone --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests

      # ✅ ĐỂ MAVEN TẠO APK CHUẨN, KHÔNG TẠO THỦ CÔNG NỮA
      - name: Build project & tạo APK gốc
        run: |
          mvn clean package -pl :base,:integration-android,:wallet -am -DskipTests
          ls -la wallet/target/*.apk || true

      # ✅ CHỈ KÝ LẠI ĐỦ CHUẨN
      - name: Ký APK chuẩn
        run: |
          B34=$ANDROID_HOME/build-tools/34.0.0
          SIGNER=$B34/apksigner
          APK_SRC="wallet/target/wallet-3.17-test.apk"
          APK_FINAL="wallet/target/wallet-3.17-final.apk"

          keytool -genkey -noprompt -keystore debug.ks -storepass android -alias d -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=D"

          $SIGNER sign --ks debug.ks \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias d \
            --min-sdk-version 10 --max-sdk-version 36 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK_FINAL" "$APK_SRC"

          $SIGNER verify --verbose "$APK_FINAL"
          $B34/aapt dump badging "$APK_FINAL" | grep -E "package|versionCode|versionName|sdkVersion"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-Android16
          path: wallet/target/wallet-3.17-final.apk
          retention-days: 7
