# ✅ BỎ HẾT KHỐI TẠO APK THỦ CÔNG BẰNG dx/zip/apksigner
# ✅ ĐỂ MAVEN TẠO RA APK CHUẨN, CHỈ KÝ LẠI LÀ ĐƯỢC

- name: Build project & tạo APK chuẩn
  run: |
    mvn clean package -pl :base,:integration-android,:wallet -am -DskipTests
    echo "=== APK được tạo tự động ==="
    ls -la wallet/target/*.apk wallet/target/*.ap_ || true

- name: Ký lại APK chuẩn cho Android 16
  run: |
    B34=$ANDROID_HOME/build-tools/34.0.0
    SIGNER=$B34/apksigner
    APK_RAW="wallet/target/wallet-3.17-test.apk"
    APK_OUT="wallet/target/wallet-3.17-final.apk"

    keytool -genkey -noprompt -keystore debug.ks -storepass android -alias d -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=D"

    $SIGNER sign --ks debug.ks \
      --ks-pass pass:android --key-pass pass:android --ks-key-alias d \
      --min-sdk-version 10 --max-sdk-version 36 \
      --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
      --out "$APK_OUT" "$APK_RAW"

    echo "✅ Kiểm tra ký & thông tin APK:"
    $SIGNER verify --verbose "$APK_OUT"
    $B34/aapt dump badging "$APK_OUT" | grep -E "sdkVersion|package|version"

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: Bitcoin-Wallet-v3.17-Android16
    path: wallet/target/wallet-3.17-final.apk
    retention-days: 7
