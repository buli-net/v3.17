name: Build Bitcoin Wallet v3.17

on:
  workflow_dispatch

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      # ✅ Lấy thẳng code từ nhánh main, KHÔNG DÙNG FILE ZIP
      - name: Lấy mã nguồn v3.17
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Kiểm tra manifest
        run: |
          echo "=== targetSdk hiện tại ==="
          grep "targetSdkVersion" wallet/AndroidManifest.xml

      - name: Cài đặt Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" "platform-tools" \
            "build-tools;26.0.3" "build-tools;33.0.2" \
            "platforms;android-26" "platforms;android-33"

      - name: Tạo apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'EOF'
          #!/bin/bash
          [ -n "$1" ] && touch "${@: -1}"
          exit 0
          EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Cài đặt Maven + HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
<settings>
  <mirrors>
    <mirror>
      <id>central</id>
      <url>https://repo.maven.apache.org/maven2</url>
      <mirrorOf>central</mirrorOf>
    </mirror>
  </mirrors>
</settings>
EOF

      - name: Build bitcoinj 0.10.1
        run: |
          git clone --depth 1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          git checkout b4a57eb8055a54fd3aab6133835d91d9967d9f98
          mvn clean install -DskipTests -q

      - name: Build dự án
        run: mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Đóng gói & ký chuẩn
        run: |
          B26=$ANDROID_HOME/build-tools/26.0.3
          B33=$ANDROID_HOME/build-tools/33.0.2
          DX=$B26/dx
          ZIPALIGN=$B33/zipalign
          SIGNER=$B33/apksigner

          AP_RAW="wallet/target/wallet-3.17-test.ap_"
          CLS_DIR="wallet/target/classes"
          OUT_APK="wallet/target/wallet-3.17-test.apk"
          WORK="/tmp/apk-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          DEPS=$(find ~/.m2/repository -name "*.jar" | grep -E "(bitcoinj-0\.10\.1|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|slf4j-api|logback-android)" | grep -v sources)
          $DX --dex --output="$WORK/classes.dex" "$CLS_DIR" $DEPS

          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$AP_RAW"
          cp classes.dex .
          zip -qr "$GITHUB_WORKSPACE/unsigned.apk" .

          cd "$GITHUB_WORKSPACE"
          $ZIPALIGN -f 4 unsigned.apk aligned.apk

          keytool -genkey -noprompt -keystore debug.ks \
            -storepass android -alias d -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=D"

          $SIGNER sign --ks debug.ks \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias d \
            --min-sdk-version 10 --max-sdk-version 35 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT_APK" aligned.apk

          echo "✅ Kết quả:"
          ls -la "$OUT_APK"
          $SIGNER verify --verbose "$OUT_APK"
          $B33/aapt dump badging "$OUT_APK" | grep -E "sdkVersion|package"

      - name: Lưu APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-Final
          path: wallet/target/wallet-3.17-test.apk
          retention-days: 7
