name: Build Bitcoin Wallet v3.17 Android16

on:
  workflow_dispatch

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    name: Build APK cho Android 16
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code nhánh main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java 17 cài SDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" "platform-tools" \
            "build-tools;26.0.3" "build-tools;34.0.0" \
            "platforms;android-26" "platforms;android-34"

      - name: Tạo apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'EOF'
          #!/bin/bash
          [ -n "$1" ] && touch "${@: -1}"
          exit 0
          EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Quay về Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài Maven
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          echo '<settings><mirrors><mirror><id>c</id><url>https://repo.maven.apache.org/maven2</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>' > ~/.m2/settings.xml

      - name: Build bitcoinj v0.10.1
        run: |
          git clone --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests

      # ✅ ĐÃ SỬA: CHỈ CHẠY package, KHÔNG CHẠY install
      - name: Build dự án - KHẮC PHỤC LỖI
        run: |
          mvn clean package -pl :base,:integration-android,:wallet -am -DskipTests \
            -Dmaven-install-plugin.skip=true

          echo "=== File .ap_ đã tạo ==="
          ls -la wallet/target/*.ap_ || true

      - name: Đóng gói & ký chuẩn Android 16
        run: |
          B26=$ANDROID_HOME/build-tools/26.0.3
          B34=$ANDROID_HOME/build-tools/34.0.0
          DX=$B26/dx
          ZIPALIGN=$B34/zipalign
          SIGNER=$B34/apksigner

          AP_RAW="wallet/target/wallet-3.17-test.ap_"
          CLS_DIR="wallet/target/classes"
          OUT_APK="wallet/target/wallet-3.17-test.apk"
          WORK="/tmp/apk-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          DEPS=$(find ~/.m2/repository -name "*.jar" | grep -E "(bitcoinj-0\.10\.1|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|slf4j-api|logback-android)" | grep -v sources)
          $DX --dex --output="$WORK/classes.dex" "$CLS_DIR" $DEPS

          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$AP_RAW"
          cp classes.dex .
          zip -qr "$GITHUB_WORKSPACE/unsigned.apk" .

          cd "$GITHUB_WORKSPACE"
          $ZIPALIGN -f 4 unsigned.apk aligned.apk

          keytool -genkey -noprompt -keystore debug.ks -storepass android -alias d -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=D"
          $SIGNER sign --ks debug.ks --ks-pass pass:android --key-pass pass:android --ks-key-alias d --min-sdk-version 10 --max-sdk-version 36 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT_APK" aligned.apk

          $SIGNER verify --verbose "$OUT_APK"
          $B34/aapt dump badging "$OUT_APK" | grep -E "sdkVersion|package"

      - name: Lưu APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-Android16
          path: wallet/target/wallet-3.17-test.apk
          retention-days: 7
